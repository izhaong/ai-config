name: ci

on:
  push:
    branches: [develop, feat/**, fix/**]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # 自建 runner 网络：rustup 走国内镜像
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static
  RUSTUP_UPDATE_ROOT: https://mirrors.ustc.edu.cn/rust-static/rustup

jobs:
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace version fields match
        run: |
          set -euo pipefail
          V="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          PKG="$(grep -m1 '"version"' apps/agent-manager-gui/package.json | sed -E 's/.*"([^"]+)".*/\1/')"
          TAURI="$(grep -m1 '"version"' apps/agent-manager-gui/src-tauri/tauri.conf.json | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Cargo.toml=$V package.json=$PKG tauri.conf.json=$TAURI"
          test "$V" = "$PKG"
          test "$V" = "$TAURI"

  rust:
    name: rust
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: |
          cargo clippy -p agent-manager-core -p agent-manager-cli -p agent-manager-daemon \
            -p agent-manager-bus -p agent-manager-watcher -p agent-manager-store \
            --all-targets -- -D warnings
      - name: cargo test
        run: |
          cargo test -p agent-manager-core -p agent-manager-cli -p agent-manager-store \
            -p agent-manager-daemon -p agent-manager-bus -p agent-manager-watcher \
            -- --test-threads=1
      - name: cargo build release (CLI)
        run: cargo build -p agent-manager-cli --release

  gui-smoke:
    name: gui frontend smoke
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/agent-manager-gui/package-lock.json
      - name: npm ci && build frontend
        working-directory: apps/agent-manager-gui
        run: |
          npm ci
          npm run build
