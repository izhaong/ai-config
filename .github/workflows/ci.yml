name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace version fields match
        run: |
          set -euo pipefail
          V="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          PKG="$(grep -m1 '"version"' apps/agents-manager-gui/package.json | sed -E 's/.*"([^"]+)".*/\1/')"
          TAURI="$(grep -m1 '"version"' apps/agents-manager-gui/src-tauri/tauri.conf.json | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Cargo.toml=$V package.json=$PKG tauri.conf.json=$TAURI"
          test "$V" = "$PKG"
          test "$V" = "$TAURI"

  rust:
    name: rust (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: |
          cargo clippy -p agents-manager-core -p agents-manager-cli -p agents-manager-daemon \
            -p agents-manager-bus -p agents-manager-watcher -p agents-manager-store \
            --all-targets -- -D warnings
      - name: cargo test
        run: |
          cargo test -p agents-manager-core -p agents-manager-cli -p agents-manager-store \
            -p agents-manager-daemon -p agents-manager-bus -p agents-manager-watcher \
            -- --test-threads=1
      - name: cargo build release (CLI)
        run: cargo build -p agents-manager-cli --release

  gui-smoke:
    name: gui frontend smoke
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/agents-manager-gui/package-lock.json
      - name: npm ci && build frontend
        working-directory: apps/agents-manager-gui
        run: |
          npm ci
          npm run build
