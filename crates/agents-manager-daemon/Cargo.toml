[package]
name = "agents-manager-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "agents-manager 守护进程:监听源目录变化、自动同步、暴露事件流给 agent / GUI"

[[bin]]
name = "agents-managerd"
path = "src/main.rs"

[dependencies]
agents-manager-core = { path = "../agents-manager-core" }
agents-manager-bus = { path = "../agents-manager-bus" }
agents-manager-watcher = { path = "../agents-manager-watcher" }
agents-manager-store = { path = "../agents-manager-store" }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
