[package]
name = "agent-manager-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-manager 命令行入口:agent / 人类都用,带 --json 结构化输出"

[[bin]]
name = "agent-manager"
path = "src/main.rs"

[dependencies]
agent-manager-core = { path = "../agent-manager-core" }
agent-manager-store = { path = "../agent-manager-store" }
clap.workspace = true
clap_complete = "4.5"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
camino.workspace = true
sha2.workspace = true
hex.workspace = true
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros", "schemars"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
